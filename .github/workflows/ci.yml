name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm validate
      # The phase gate. Repo-wide it reports; it is ENFORCED only over the scopes whose
      # books have been verified. Add a scope here when its `book` gates go green, and
      # raise its `--enforce` to structure, twin, then all as each phase completes.
      - run: pnpm gate --enforce none
      - run: pnpm gate sd --grade g12 --enforce book
      - run: pnpm index --check
      - run: pnpm schema:json --check
